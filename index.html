<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sổ tay làm bánh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF7E3;--card:#FFFDF6;--ink:#3B2416;--mut:#7B6553;--line:#EFDFBE;--crust:#A9631F;--butter:#F5C24B;--jam:#C93F60;--sh:0 6px 18px rgba(120,80,30,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241912;--card:#30231A;--ink:#F6E7CE;--mut:#C2AA90;--line:#4B392B;--crust:#E2A159;--sh:0 6px 18px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#241912;--card:#30231A;--ink:#F6E7CE;--mut:#C2AA90;--line:#4B392B;--crust:#E2A159;--sh:0 6px 18px rgba(0,0,0,.35)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.7 "Be Vietnam Pro","Segoe UI",Roboto,system-ui,-apple-system,sans-serif}
h1,h2,h3,.brand{font-family:"Be Vietnam Pro","Segoe UI",Roboto,system-ui,sans-serif;font-weight:700;line-height:1.3;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--crust);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;padding:.7rem 1rem;background:var(--bg);border-bottom:2px dashed var(--line)}
.brand{font-size:1.35rem;margin-right:auto}
nav{display:flex;gap:.3rem}
.btn{border:0;border-radius:999px;padding:.55rem 1.1rem;font-weight:700;cursor:pointer;background:var(--line);color:var(--ink);display:inline-block}
.btn.pri{background:var(--butter);color:#3B2416}
.btn.dng{background:var(--jam);color:#fff}
nav .btn{background:transparent}
nav .btn.on{background:var(--line);box-shadow:inset 0 -3px 0 var(--crust)}
main{max-width:1000px;margin:0 auto;padding:1.2rem 1rem 2rem}
.hero{padding:1.2rem 0 .6rem}
.hero h1{font-size:clamp(1.9rem,6vw,2.8rem)}
.hero p{margin:.3rem 0 0;color:var(--mut);max-width:60ch}
.bar{display:flex;gap:.6rem;margin:1rem 0 .7rem;flex-wrap:wrap}
.bar input,.bar select,.f input,.f select,.f textarea{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:.55rem .8rem;width:100%}
.bar input{flex:1 1 220px;width:auto}
.bar select{width:auto}
.chips{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.1rem}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:.3rem .9rem;cursor:pointer;font-weight:700}
.chip.on{background:var(--butter);border-color:var(--butter);color:#3B2416}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1rem}
.card{background:var(--card);border-radius:22px;box-shadow:var(--sh);overflow:hidden;cursor:pointer;border:0;text-align:left;padding:0;display:block;width:100%}
.card:hover{transform:translateY(-3px);transition:transform .15s}
.cov{height:150px;display:grid;place-items:center;font-size:3.6rem;background:color-mix(in srgb,var(--cc,#E3A83E) 35%,var(--card))}
.cov img{width:100%;height:100%;object-fit:cover}
.cb{padding:.8rem 1rem 1rem}
.cb h3{font-size:1.15rem;margin:.35rem 0 .2rem}
.cb small{color:var(--mut)}
.c-Bread{--cc:#E3A83E}.c-Pastry{--cc:#E0678A}.c-Cake{--cc:#9A6A52}
.c-Starter{--cc:#E3A83E}.c-Preferment{--cc:#E0678A}.c-Ingredients{--cc:#7FA35A}.c-Techniques{--cc:#5B94C4}.c-Tips{--cc:#9A6A52}
.badge{display:inline-block;padding:.05rem .65rem;border-radius:999px;font-size:.82rem;font-weight:700;background:color-mix(in srgb,var(--cc,#E3A83E) 30%,var(--card));border:1.5px solid var(--cc,#E3A83E)}
.empty{grid-column:1/-1;text-align:center;padding:2.5rem 1rem;color:var(--mut);background:var(--card);border-radius:22px;border:2px dashed var(--line)}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin:.8rem 0}
.doc{background:var(--card);border-radius:22px;box-shadow:var(--sh);padding:1.2rem}
.doc h1{font-size:2rem;margin:.4rem 0}
.doc h2{font-size:1.3rem;margin:1.4rem 0 .5rem}
.doc h3{font-size:1.1rem;margin:1rem 0 .3rem;color:var(--crust)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:.6rem;margin:.6rem 0}
.gal img,.gal video{width:100%;border-radius:16px;max-height:420px;object-fit:cover;background:var(--line)}
.gal>:first-child{grid-column:1/-1}
.ban{height:160px;display:grid;place-items:center;font-size:4.5rem;border-radius:16px;background:color-mix(in srgb,var(--cc,#E3A83E) 35%,var(--card))}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:.5rem .7rem;border-bottom:1.5px solid var(--line);text-align:left}
th{background:var(--line)}
td.n{text-align:right;white-space:nowrap}
.note{font-size:.88rem;color:var(--mut)}
.warn{background:color-mix(in srgb,var(--butter) 30%,var(--card));border-left:5px solid var(--butter);border-radius:12px;padding:.6rem .9rem;margin:.7rem 0}
ol,ul{padding-left:1.3rem}li{margin:.3rem 0}
.f label{display:block;font-weight:700;margin:.9rem 0 .25rem}
.f textarea{min-height:110px;resize:vertical}
.ing{display:grid;grid-template-columns:1fr 90px 60px 36px;gap:.4rem;margin:.35rem 0}
.ing{padding-bottom:.5rem;border-bottom:1px dashed var(--line)}.ing input{padding:.4rem .6rem}.ing .nt{grid-column:1/-1;background:color-mix(in srgb,var(--butter) 18%,var(--card))}.tb{display:flex;gap:.3rem;flex-wrap:wrap;margin-bottom:.3rem}.tb button{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:.15rem .6rem;cursor:pointer}.two{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}td.nn{color:var(--crust);font-weight:700}
.x{border:0;background:none;color:var(--jam);font-weight:700;cursor:pointer}
.th{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.5rem}
.th div{position:relative;width:92px;height:92px}
.th img,.th video{width:100%;height:100%;object-fit:cover;border-radius:12px}
.th button{position:absolute;top:-6px;right:-6px;width:26px;height:26px;border-radius:50%;border:0;background:var(--jam);color:#fff;cursor:pointer}
footer{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;padding:1rem 1rem 2rem;color:var(--mut)}
#toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.6rem 1.1rem;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:9}
#toast.on{opacity:1}
.scale{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin:.8rem 0;padding:.7rem .9rem;border-radius:16px;background:color-mix(in srgb,var(--butter) 18%,var(--card));border:2px dashed var(--line)}
.scale label{font-weight:700}.scale input{width:110px;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:.4rem .6rem}
.facts{display:flex;gap:.5rem;flex-wrap:wrap;margin:.7rem 0}.facts span{background:var(--line);border-radius:999px;padding:.25rem .85rem;font-weight:700}
.calc{background:var(--bg);border-radius:12px;padding:.5rem .8rem;font-variant-numeric:tabular-nums}
.ck2{display:flex;gap:.7rem;align-items:flex-start;padding:.65rem .2rem;border-bottom:1px dashed var(--line);cursor:pointer}
.ck2 input{width:1.4rem;height:1.4rem;accent-color:var(--crust);flex:none;margin-top:.2rem}
.ck2 input:checked+span{text-decoration:line-through;opacity:.55}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.prog i{display:block;height:100%;background:var(--butter);width:0;transition:width .2s}
.nag{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin:.8rem 0}
.f label.ck{display:flex;gap:.5rem;align-items:center;font-weight:500;margin:.3rem 0}.f .ck input{width:auto}
#pend{padding:0 1rem}#pend .warn{max-width:1000px;margin:.6rem auto;display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style id="v3">
:root{--bg:#FAF6F0;--card:#FFFDF9;--ink:#2B211C;--mut:#7A6A5E;--line:#E5DACD;--crust:#8C2F39;--butter:#8C2F39;--jam:#B3402F;--accs:#F3E3DF;--onacc:#fff;--gl:rgba(250,246,240,.8);--sh:0 18px 40px -24px rgba(60,35,20,.5)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1A1412;--card:#221A17;--ink:#F1E7DB;--mut:#B5A392;--line:#3A2E28;--crust:#E08A94;--butter:#E08A94;--jam:#E07060;--accs:#3A2427;--onacc:#1A1412;--gl:rgba(26,20,18,.8);--sh:0 18px 40px -24px #000}}
:root[data-theme="dark"]{--bg:#1A1412;--card:#221A17;--ink:#F1E7DB;--mut:#B5A392;--line:#3A2E28;--crust:#E08A94;--butter:#E08A94;--jam:#E07060;--accs:#3A2427;--onacc:#1A1412;--gl:rgba(26,20,18,.8);--sh:0 18px 40px -24px #000}
body{transition:background .4s,color .4s}

.btn{font-weight:500;transition:.25s}.btn.pri{background:var(--crust);color:var(--onacc)}.btn.pri:hover{transform:translateY(-2px)}.btn.dng{background:var(--jam);color:#fff}
main{max-width:1120px;padding:1.4rem 1.4rem 2rem;animation:fd .5s both}@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hero{padding:3rem 0 1.2rem}.eyebrow{display:block;font:600 .75rem "Be Vietnam Pro",sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--crust)}
.hero h1{font-size:clamp(2.2rem,6vw,3.8rem);margin:.5rem 0 .8rem}
.stats{display:flex;gap:2.2rem;flex-wrap:wrap;margin-top:1.4rem;padding-top:1rem;border-top:1px solid var(--line)}.stats b{display:block;font:500 1.9rem "Playfair Display",serif}.stats span{font-size:.78rem;color:var(--mut)}
.chips{gap:1.6rem;border-bottom:1px solid var(--line);margin-bottom:1.8rem}
.chip{border:0;background:none;border-bottom:2px solid transparent;border-radius:0;padding:.6rem 0;margin-bottom:-1px;color:var(--mut);font-weight:500;transition:.25s}.chip.on{background:none;color:var(--ink);border-color:var(--crust)}
.grid{gap:2rem 1.6rem}
.card{background:none;box-shadow:none;border-radius:0;overflow:visible}.card:hover{transform:none}
.cov{height:auto;aspect-ratio:4/3;border-radius:6px;overflow:hidden;box-shadow:var(--sh);font-size:3rem;background:var(--accs)}.cov img{transition:transform 1.1s cubic-bezier(.2,.7,.2,1)}.card:hover .cov img{transform:scale(1.07)}
.cb{padding:.9rem 0 0}.badge{background:none;border:0;padding:0;font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--crust);font-weight:600}.cb h3{font-size:1.4rem;margin:.2rem 0}
.doc{background:none;box-shadow:none;padding:0}.doc h1{font-size:clamp(2rem,5vw,3.2rem)}.doc h2{font-size:1.5rem;padding-top:1rem;border-top:1px solid var(--line)}
.gal img,.gal video{aspect-ratio:1;max-height:none;border-radius:8px;box-shadow:var(--sh)}.gal>:first-child{aspect-ratio:16/8}
.ban{background:var(--accs);border-radius:8px}
.facts{gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:1rem 0}.facts span{background:none;border-radius:0;padding:.8rem 2rem .8rem 0;font:500 1.3rem "Playfair Display",serif}
.scale{border:1px solid var(--line);background:var(--accs);border-radius:8px}.scale input{border-radius:6px}
th{background:none;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:500}
.warn{background:var(--accs);border-left:2px solid var(--crust);border-radius:0 6px 6px 0}
.bar input,.bar select,.f input,.f select,.f textarea{border-radius:6px;border:1px solid var(--line)}
.prog{height:3px}.prog i{background:var(--crust);transition:width .5s}
footer{border-top:1px solid var(--line);margin:2rem auto 0;max-width:1120px;padding-top:1.4rem}
.rv{opacity:0;transform:translateY(20px);transition:opacity .8s,transform .8s cubic-bezier(.2,.7,.2,1)}.rv.in{opacity:1;transform:none}
.dz{border:1px dashed var(--line);border-radius:8px;padding:1.1rem;text-align:center;color:var(--mut);margin:.6rem 0 1.6rem;font-size:.9rem;transition:.25s}.dz.hot{border-color:var(--crust);background:var(--accs);color:var(--crust)}
.gurl{flex:1 1 220px;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:.55rem .8rem}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:.8rem;margin-bottom:2rem}
.gt{aspect-ratio:1;overflow:hidden;border-radius:6px;position:relative;display:block;width:100%;padding:0;border:0;background:var(--line);cursor:pointer}
.gt img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.1s cubic-bezier(.2,.7,.2,1)}.gt:hover img{transform:scale(1.08)}
.gt span{position:absolute;left:0;right:0;bottom:0;padding:1.6rem .7rem .55rem;font-size:.78rem;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.65));opacity:0;transition:.3s;text-align:left}.gt:hover span,.gt:focus-visible span{opacity:1}
#lb{position:fixed;inset:0;background:rgba(15,10,8,.94);z-index:20;display:none;grid-template-rows:1fr auto;padding:calc(1rem + env(safe-area-inset-top,0px)) 1rem calc(1rem + env(safe-area-inset-bottom,0px))}#lb.on{display:grid;animation:fd .3s both}
.lv{display:grid;place-items:center;min-height:0}.lv img{max-width:100%;max-height:72vh;border-radius:6px}
.lc{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;justify-content:center;color:#f1e7db;padding-top:.9rem}.lc input,.lc select{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:#f1e7db;border-radius:6px;padding:.45rem .7rem;max-width:100%}.lc option{color:#000}.lc button{border:1px solid rgba(255,255,255,.25);background:none;border-radius:999px;padding:.4rem 1rem;color:#f1e7db;cursor:pointer;transition:.2s}.lc button:hover{border-color:#e08a94;color:#e08a94}
@media (max-width:760px){.hero{padding-top:1.6rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style>
<style id="v4">
:root{--bg:#FFF8F6;--card:#FFFDFC;--ink:#4A3B3F;--mut:#8E7C82;--line:#F0DDE0;--crust:#C2547A;--butter:#F7C6D4;--jam:#C9485F;--accs:#FBE7EC;--pri:#F5B5C8;--pri2:#F0A2BA;--gl:rgba(255,248,246,.75);--sh:0 18px 40px -24px rgba(194,84,122,.4);--ovp:15%;--ovi:60%}

:root[data-theme="dark"]{--bg:#211A20;--card:#2B222A;--ink:#F6E9EE;--mut:#BBA9B1;--line:#43363F;--crust:#F0A3BC;--butter:#E9A6BC;--jam:#C9485F;--accs:#3A2630;--pri:#E9A6BC;--pri2:#F0B6C8;--gl:rgba(33,26,32,.72);--sh:0 18px 40px -24px rgba(0,0,0,.7);--ovp:72%;--ovi:80%}
.c-Bread{--cc:#FBD5C4}.c-Pastry{--cc:#F7C6D4}.c-Cake{--cc:#DCD3F2}.c-Starter{--cc:#FCE8B8}.c-Preferment{--cc:#CDEBDD}.c-Ingredients{--cc:#FCE8B8}.c-Techniques{--cc:#CFE3F7}.c-Tips{--cc:#DCD3F2}

.top #new{padding:.7rem 1.4rem;font-size:.95rem}

</head>
<body>
<div id="bgl" aria-hidden="true"></div>
<header class="top">
  <div class="brand">Sổ tay <i>làm bánh</i></div>
  <nav><button class="btn" data-a="tab" data-id="recipes">Công thức</button><button class="btn" data-a="tab" data-id="lessons">Bài học</button><button class="btn" id="gnav" data-a="gal">Thư viện ảnh</button></nav>
  <button class="btn pri" id="new" data-a="new"></button>
  <button class="btn" id="th" data-a="theme"></button>
</header>
<div id="pend"></div>
<main id="app"></main>
<footer>
  <button class="btn" data-a="export">Xuất bản sao lưu</button>
  <span class="note" id="bk"></span>

</footer>

<div id="toast" role="status"></div>
<script>
const CATS=['Bread','Pastry','Cake'],TAGS=['Starter','Preferment','Ingredients','Techniques','Tips'],EMO={Bread:'🥖',Pastry:'🥐',Cake:'🍰',Starter:'🫙',Preferment:'🌾',Ingredients:'🧈',Techniques:'👐',Tips:'💡'};
const L={All:'Tất cả',Bread:'Bánh mì',Pastry:'Bánh ngọt',Cake:'Bánh kem',Starter:'Men starter',Preferment:'Bột ủ',Ingredients:'Nguyên liệu',Techniques:'Kỹ thuật',Tips:'Mẹo hay',Easy:'Dễ',Medium:'Vừa',Hard:'Khó'},lb=c=>L[c]||c,DF={Easy:'🟢',Medium:'🟡',Hard:'🔴'},fd=d=>d?d.split('-').reverse().join('/'):'';
const BASE=[['Bread flour',500],['Salt',10],['Improver',5],['Yeast',5],['Cold water',330],['Sugar',20],['Butter',20]];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
let db={recipes:[],lessons:[]},ui={tab:'recipes',cat:'All',tag:'All',q:'',sort:'new',view:'list',id:null,d:null,k:''};

/* storage: IndexedDB keeps photos and videos without the small localStorage limit */
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open('bakingnotebook',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
async function load(){try{const d=await idb();return await new Promise(ok=>{const q=d.transaction('kv').objectStore('kv').get('db');q.onsuccess=()=>ok(q.result);q.onerror=()=>ok(null)})}catch(e){return null}}
async function save(){try{const d=await idb();d.transaction('kv','readwrite').objectStore('kv').put(db,'db')}catch(e){toast('Không lưu được trên trình duyệt này')}}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2400)}

function seed(){const t=Date.now();return{recipes:[
{id:uid(),name:'Baguette',cat:'Bread',time:'4 hours',oven:'240',yn:2,yu:'ổ baguette',ts:t,media:[],ings:[['Bread flour',500],['Cold water',350],['Salt',10],['Yeast',2],['Improver',3]].map(([n,a])=>({n,a,u:'g'})),
steps:'Mix flour, water and improver. Rest 20 minutes.\nAdd salt and yeast, mix until smooth.\nBulk ferment 2 hours, folding every 40 minutes.\nDivide, pre-shape and rest 20 minutes.\nShape into batons and proof 60 minutes.\nScore and bake at 240°C with steam for about 22 minutes.',tips:'! Use cold water so the dough stays cool while mixing.\nA hot, steamy oven gives the crackly crust and open crumb.'},
{id:uid(),name:'Vanilla sponge cake',cat:'Cake',time:'1 hour',oven:'170',yn:1,yu:'bánh',ts:t-1,media:[],ings:[['Cake flour',200,'g'],['Sugar',180,'g'],['Butter',150,'g'],['Eggs',3,'pcs'],['Milk',60,'ml'],['Baking powder',6,'g']].map(([n,a,u])=>({n,a,u})),
steps:'Cream butter and sugar until pale.\nBeat in eggs one at a time.\nFold in flour, baking powder and milk.\nBake at 170°C for 30 to 35 minutes.',tips:'! Have butter and eggs at room temperature for a smooth batter.'}],
lessons:[
{id:uid(),title:'How to make a biga',tag:'Preferment',ts:t,media:[],ca:'',cb:'',cmp:'',body:'Biga is a stiff Italian preferment made from flour, water and a pinch of yeast. It adds flavor and strength to the dough.\n## Basic ratio\n- 100% flour\n- 45 to 50% water\n- A pinch of yeast (about 1% fresh or 0.3% instant)\n## Steps\n- Mix until shaggy. No kneading needed\n- Ferment 12 to 16 hours at 16 to 18°C\n- Use it when it is domed and full of bubbles\n! A room that is too warm makes the biga over-ferment and turn sour. Use a cooler spot or less yeast.'},
{id:uid(),title:'Types of yeast',tag:'Ingredients',ts:t-1,media:[],ca:'',cb:'',cmp:'Feature|Fresh|Instant|Active dry\nForm|Moist block|Fine granules|Coarse granules\nActivation|Crumble into dough|Mix into flour|Dissolve in warm water first\nAmount vs fresh|100%|about 33%|about 50%\nKeeps|Days to weeks, fridge|Months|Months',body:'Yeast comes in three common forms. They all do the same job, so you can swap them by adjusting the amount.\n! Never put salt directly on yeast. It slows the yeast down.'}]}}

/* helpers */
const rd=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(Error('Không đọc được tệp'));r.readAsDataURL(f)});
async function shrink(f,m=1200){const src=await rd(f);return new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const s=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.82))};i.onerror=()=>no(Error('Không đọc được ảnh'));i.src=src})}
const inl=z=>esc(z).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>');
function md(t){let o='',c='';const cl=()=>{if(c){o+='</'+c+'>';c=''}};
for(const l of String(t||'').split('\n')){const z=l.trim(),b=z.startsWith('- ')?'ul':/^\d+[.)]\s/.test(z)?'ol':'';
if(c&&c!=b)cl();
if(b){if(!c){o+='<'+b+'>';c=b}o+='<li>'+inl(z.replace(/^(- |\d+[.)]\s)/,''))+'</li>'}
else if(z.startsWith('## '))o+='<h3>'+inl(z.slice(3))+'</h3>'
else if(z.startsWith('! '))o+='<div class="warn">⚠️ '+inl(z.slice(2))+'</div>'
else if(z)o+='<p>'+inl(z)+'</p>'}
cl();return o}
const gal=m=>m&&m.length?`<div class="gal">${m.map(x=>x.type=='video'?`<video src="${x.src}" controls playsinline></video>`:`<img src="${x.src}" alt="">`).join('')}</div>`:'';
const cur=()=>(ui.tab=='recipes'?db.recipes:db.lessons).find(x=>x.id==ui.id);
const key=x=>ui.tab=='recipes'?x.cat:x.tag;


/* v2 helpers */
const F=(v,d=1)=>String(Math.round(v*10**d)/10**d).replace('.',','),fdt=t=>new Date(t).toLocaleDateString('vi-VN');
const flr=x=>x.ings.filter(i=>/flour/i.test(i.n)).reduce((a,i)=>a+(+i.a||0),0);
const fac=x=>ui.sc&&ui.sc.id==x.id&&flr(x)>0?ui.sc.g/flr(x):1;
const scl=(i,f)=>{const v=+i.a*f;return /^(g|ml|kg|l)$/i.test(i.u)?(v<10?F(v):F(v,0)):F(Math.round(v*2)/2)};
const TH=['auto','light','dark'],THL={auto:'◐',light:'☀\uFE0E',dark:'☾\uFE0E'},TN={auto:'Giao diện: theo hệ thống',light:'Giao diện: sáng',dark:'Giao diện: tối'};
function theme(n){let t='auto';try{t=n||localStorage.getItem('theme')||'auto';if(n)localStorage.setItem('theme',n)}catch(e){}
 if(t=='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.dataset.theme=t;$('#th').textContent=THL[t];$('#th').title=TN[t];$('#th').setAttribute('aria-label',TN[t]);return t}
const GUIDE=()=>({id:'guide-scale',title:'Cách scale công thức và Baker’s %',tag:'Techniques',ts:Date.now(),media:[],ca:'',cb:'',
cmp:'Nguyên liệu|Gốc (g)|Baker’s %|Scale ×1,5 (g)\nBread flour|500|100%|750\nCold water|350|70%|525\nSalt|10|2%|15\nYeast|2|0,4%|3\nImprover|3|0,6%|4,5',
body:'Baker’s % (phần trăm thợ làm bánh) tính mọi nguyên liệu theo khối lượng bột. Bột luôn là 100%, nên chỉ cần đổi lượng bột là cả công thức đổi theo.\n## Công thức\n- Baker’s % = khối lượng nguyên liệu ÷ tổng khối lượng bột × 100\n- Hệ số scale = lượng bột muốn dùng ÷ lượng bột trong công thức gốc\n- Khối lượng mới = khối lượng gốc × hệ số scale\n## Ví dụ: Baguette\nCông thức gốc dùng 500 g Bread flour, 350 g Cold water, 10 g Salt. Muốn dùng 750 g bột:\n- Hệ số = 750 ÷ 500 = 1,5\n- Cold water: 350 × 1,5 = 525 g (baker’s % vẫn là 350 ÷ 500 = 70%)\n- Salt: 10 × 1,5 = 15 g (10 ÷ 500 = 2%)\n- Thành phẩm 2 ổ baguette thì thành 2 × 1,5 = 3 ổ\n## Làm tròn\n- g và ml: dưới 10 làm tròn đến 0,1, từ 10 trở lên làm tròn số nguyên\n- Nguyên liệu đếm được (quả, cái): làm tròn đến 0,5\n! Với lượng rất nhỏ như men hay muối nên dùng cân tiểu ly. Khi nhân lên nhiều lần, thời gian ủ và nướng có thể cần chỉnh theo quan sát.'});
function norm(d){d.settings=d.settings||{};d.gallery=d.gallery||[];d.sessions=d.sessions||{};d.meta=d.meta||{};if(!d.meta.guide){d.meta.guide=1;if(!d.lessons.some(l=>l.id=='guide-scale'))d.lessons.push(GUIDE())}d.recipes.forEach(r=>{r.links=r.links||[];r.made=r.made||[]});return d}
function facts(x){const f=fac(x),y=+x.yn?`<span>🍞 ${f!=1?'≈ ':''}${F(Math.round(x.yn*f*2)/2)} ${esc(x.yu||'')}</span>`:'',o=x.oven?`<span>🔥 ${esc(x.oven)}°C</span>`:'';return o||y?`<div class="facts">${o}${y}</div>`:''}
function tbl(x){const fl=flr(x),f=fac(x),hn=x.ings.some(i=>i.note),e=x.ings.find(i=>!/flour/i.test(i.n)&&+i.a&&/^(g|ml)$/i.test(i.u));
const calc=fl&&f!=1?`<p class="calc">Hệ số = ${F(ui.sc.g)} ÷ ${F(fl)} = ${F(f,2)}${e?` · ${esc(e.n)}: ${F(+e.a)} × ${F(f,2)} = ${scl(e,f)} ${esc(e.u)}`:''}</p>`:'';
return`<h2>Nguyên liệu</h2>${calc}<div class="tw"><table><tr><th>Nguyên liệu</th><th class="n">Khối lượng</th>${fl?'<th class="n">Baker’s %</th>':''}${hn?'<th>📝 Ghi chú</th>':''}</tr>${x.ings.map(i=>`<tr><td>${esc(i.n)}</td><td class="n">${+i.a?scl(i,f):esc(i.a)} ${esc(i.u)}${f!=1&&+i.a?` <small class="note">(gốc ${esc(i.a)})</small>`:''}</td>${fl?`<td class="n">${+i.a?Math.round(i.a/fl*1000)/10+'%':''}</td>`:''}${hn?`<td class="nn">${esc(i.note||'')}</td>`:''}</tr>`).join('')}</table></div>${fl?'<p class="note">Baker’s % = khối lượng nguyên liệu ÷ tổng khối lượng bột (tính theo công thức gốc).</p>':''}`}
function upd(){const x=cur();if(!x)return;$('#fct').innerHTML=facts(x);$('#scv').innerHTML=tbl(x)}
function nag(){const m=db.meta||{},d=m.lastBackup?Math.floor((Date.now()-m.lastBackup)/864e5):0,old=m.lastBackup?d>=7:(!m.created||Date.now()-m.created>2*864e5);
return old?`<div class="warn nag"><span>💾 ${m.lastBackup?'Đã '+d+' ngày chưa sao lưu.':'Bạn chưa sao lưu lần nào.'} Dữ liệu chỉ nằm trong trình duyệt này, hãy xuất một bản để phòng khi mất dữ liệu.</span><button class="btn pri" data-a="export">Xuất bản sao lưu</button></div>`:''}
function side(){const m=db.meta||{},n=ui.pend;$('#bk').textContent=m.lastBackup?'Sao lưu gần nhất: '+fdt(m.lastBackup):'Chưa sao lưu lần nào';
$('#pend').innerHTML=n?`<div class="warn">Tệp đang chờ nhập có ${n.recipes.length} công thức, ${n.lessons.length} bài học. <button class="btn pri" data-a="impmg">Gộp thêm (giữ dữ liệu cũ)</button> <button class="btn dng" data-a="impok">Thay thế toàn bộ</button> <button class="btn" data-a="impno">Hủy</button></div>`:''}
function prog(){const s=db.sessions[ui.id];if(!s||ui.view!='cook')return;const b=[...document.querySelectorAll('.ck2 input')],d=b.filter(e=>e.checked).length;$('#pb').style.width=(b.length?d/b.length*100:0)+'%';$('#pt').textContent=d+'/'+b.length+' mục đã tick'}
function vCook(){const x=cur(),s=x&&db.sessions[x.id];if(!x||!s){ui.view='list';return vList()}
const f=s.f||1,c=s.c||{},steps=(x.steps||'').split('\n').map(z=>z.trim()).filter(z=>z&&!/^(## |! )/.test(z)).map(z=>z.replace(/^(- |\d+[.)]\s)/,''));
const it=(k,h)=>`<label class="ck2"><input type="checkbox" data-a="tk" data-k="${k}"${c[k]?' checked':''}><span>${h}</span></label>`;
return`<section class="doc"><div class="row"><button class="btn" data-a="cback">← Tạm dừng</button><button class="btn dng" data-a="ccl">${ui.conf=='c'+x.id?'Bấm lần nữa để hủy':'Hủy'}</button></div><h1>${esc(x.name)}</h1><p class="note">Checklist làm bánh${f!=1?' · hệ số ×'+F(f,2):''}${x.oven?' · 🔥 '+esc(x.oven)+'°C':''}</p><div class="prog"><i id="pb"></i></div><p class="note" id="pt"></p>
<h2>Nguyên liệu</h2>${x.ings.map((i,k)=>it('i'+k,`<b>${esc(i.n)}</b> ${+i.a?scl(i,f):esc(i.a)} ${esc(i.u)}${i.note?`<br><small class="note">📝 ${esc(i.note)}</small>`:''}`)).join('')}
<h2>Các bước</h2>${steps.map((z,k)=>it('s'+k,inl(z))).join('')}
<div class="row"><button class="btn pri" data-a="done">✅ Đã hoàn thành</button></div></section>`}

/* views */
function list(){const q=ui.q.trim().toLowerCase(),rec=ui.tab=='recipes',f=rec?ui.cat:ui.tag;
let a=(rec?db.recipes:db.lessons).filter(x=>(f=='All'||key(x)==f)&&(!q||(rec?x.name+' '+x.ings.map(i=>i.n).join(' '):x.title+' '+x.body).toLowerCase().includes(q)));
a.sort(ui.sort=='az'?(x,y)=>(x.name||x.title).localeCompare(y.name||y.title):ui.sort=='date'?(x,y)=>(y.date||'').localeCompare(x.date||''):(x,y)=>y.ts-x.ts);
if(!a.length)return`<div class="empty">${rec?'Chưa có công thức nào. Bấm “+ Công thức mới” để thêm.':'Chưa có bài học nào. Bấm “+ Bài học mới” để thêm.'}</div>`;
return a.map(x=>{const im=(x.media||[]).find(m=>m.type=='image')||(rec&&db.gallery.find(g=>g.rid==x.id));return`<button class="card c-${key(x)}" data-a="open" data-id="${x.id}"><div class="cov">${im?`<img src="${im.src}" alt="">`:EMO[key(x)]||'🍞'}</div><div class="cb"><span class="badge">${lb(key(x))}</span><h3>${esc(x.name||x.title)}</h3>${rec?`<small>${[x.diff&&lb(x.diff),x.time,x.date&&fd(x.date),x.made&&x.made.length?'Đã làm '+x.made.length+' lần':''].filter(Boolean).map(esc).join(' · ')}</small>`:''}</div></button>`}).join('')}

const IO='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');IO.unobserve(e.target)}}),{threshold:.08}):null;
function rvl(){document.querySelectorAll('.card,.gt').forEach((el,i)=>{el.classList.add('rv');el.style.transitionDelay=Math.min(i*60,360)+'ms';IO?IO.observe(el):el.classList.add('in')})}
const stats=rec=>rec?`<div class="stats"><div><b>${db.recipes.length}</b><span>Công thức</span></div><div><b>${db.lessons.length}</b><span>Bài học</span></div><div><b>${db.recipes.reduce((a,r)=>a+(r.made||[]).length,0)}</b><span>Lần đã làm</span></div><div><b>${db.gallery.length}</b><span>Ảnh</span></div></div>`:'';
const rn=id=>(db.recipes.find(r=>r.id==id)||{}).name||'';
const gt=(g,rv)=>`<button class="gt${rv?' rv':''}" data-a="gopen" data-id="${g.id}"><img src="${g.src}" alt="${esc(g.cap||'Ảnh bánh')}" loading="lazy"><span>${esc(rn(g.rid)||'Chưa gắn công thức')}${g.cap?' · '+esc(g.cap):''}</span></button>`;
function mine(x){const a=db.gallery.filter(g=>g.rid==x.id);return`<h2>Ảnh của tôi</h2>${a.length?`<div class="gg">${a.map(g=>gt(g,0)).join('')}</div>`:'<p class="note">Chưa có ảnh nào cho công thức này. Vào Thư viện ảnh để thêm và gắn ảnh.</p>'}<div class="row"><button class="btn" data-a="gal">Mở Thư viện ảnh</button></div>`}
function vGal(){const f=ui.gf||'All',g=db.gallery,arr=g.filter(x=>f=='All'||(f=='none'?!x.rid:x.rid==f)),ch=[['All','Tất cả'],['none','Chưa gắn công thức'],...db.recipes.filter(r=>g.some(x=>x.rid==r.id)).map(r=>[r.id,r.name])];
return`<section class="hero"><span class="eyebrow">Kho ảnh</span><h1>Thư viện ảnh</h1><p>Ảnh bánh do chính bạn chụp qua từng lần làm. Bấm vào ảnh để ghi chú và gắn vào công thức.</p></section>
<div class="row"><label class="btn pri" style="cursor:pointer">＋ Tải ảnh lên<input type="file" id="gfile" accept="image/*" multiple hidden></label><input id="gurl" class="gurl" placeholder="Hoặc dán link ảnh" aria-label="Link ảnh"><button class="btn" data-a="glink">Thêm link</button></div>
<div class="dz" id="dz">Kéo thả ảnh vào đây, hoặc dán ảnh bằng Ctrl+V</div>
<div class="chips">${ch.map(([k,n])=>`<button class="chip${k==f?' on':''}" data-a="gf" data-id="${k}">${esc(n)}</button>`).join('')}</div>
<div class="gg">${arr.length?arr.map(x=>gt(x,1)).join(''):'<div class="empty">Chưa có ảnh nào ở mục này.</div>'}</div>`}
function lo(id){const g=db.gallery.find(x=>x.id==id);if(!g)return;ui.lbid=id;$('#lv').innerHTML=`<img src="${g.src}" alt="">`;$('#lbc').value=g.cap||'';$('#lbt').innerHTML='<option value="">Chưa gắn công thức</option>'+db.recipes.map(r=>`<option value="${r.id}"${r.id==g.rid?' selected':''}>${esc(r.name)}</option>`).join('');$('#lb').classList.add('on')}
function lc(){$('#lb').classList.remove('on');ui.lbid=null}
function ln(d){const a=db.gallery,i=a.findIndex(x=>x.id==ui.lbid);if(i>=0&&a.length)lo(a[(i+d+a.length)%a.length].id)}
async function addPhotos(fs){let n=0;for(const f of fs){if(!f||!/^image\//.test(f.type))continue;try{db.gallery.unshift({id:uid(),src:await shrink(f,1600),cap:'',rid:'',ts:Date.now()});n++}catch(x){toast(x.message)}}if(n){await save();ui.gf='All';render();toast('Đã thêm '+n+' ảnh')}}
async function fromLink(u){u=(u||'').trim();if(!/^https?:\/\//i.test(u)){toast('Hãy dán link ảnh bắt đầu bằng http hoặc https');return null}try{const b=await(await fetch(u)).blob();if(!/^image\//.test(b.type))throw 0;return{src:await shrink(b,1600)}}catch(e){toast('Trang nguồn không cho tải ảnh, nên mình chỉ lưu link. Ảnh có thể mất nếu trang gốc xóa.');return{src:u,link:1}}}
const PB={macaron:'radial-gradient(at 12% 10%,#F7C6D4 0,transparent 46%),radial-gradient(at 88% 6%,#DCD3F2 0,transparent 46%),radial-gradient(at 82% 92%,#CDEBDD 0,transparent 46%),radial-gradient(at 8% 88%,#FCE8B8 0,transparent 46%),var(--bg)',
mint:'radial-gradient(at 15% 12%,#CDEBDD 0,transparent 55%),radial-gradient(at 85% 88%,#CFE3F7 0,transparent 55%),var(--bg)',
lavender:'radial-gradient(at 12% 12%,#DCD3F2 0,transparent 55%),radial-gradient(at 88% 85%,#F7C6D4 0,transparent 55%),var(--bg)',
peach:'radial-gradient(at 12% 10%,#FBD5C4 0,transparent 55%),radial-gradient(at 88% 90%,#FCE8B8 0,transparent 55%),var(--bg)',
rose:'radial-gradient(at 10% 10%,#F7C6D4 0,transparent 55%),radial-gradient(at 90% 90%,#FBD5C4 0,transparent 55%),var(--bg)',
sky:'radial-gradient(at 12% 10%,#CFE3F7 0,transparent 55%),radial-gradient(at 88% 88%,#DCD3F2 0,transparent 55%),var(--bg)'},
PN={macaron:'Macaron',mint:'Bạc hà',lavender:'Oải hương',peach:'Đào',rose:'Hồng phấn',sky:'Xanh trời',plain:'Trơn'};
const gbg=()=>(db.settings||{}).bg||{t:'p',id:'macaron'};
function applyBg(){const b=gbg(),el=$('#bgl');if(!el)return;document.body.classList.toggle('hb',ui.view=='list'&&!(b.t=='p'&&b.id=='plain'));

s=s?v.lastIndexOf('\n',s-1)+1:0;let z=v.indexOf('\n',n);if(z<0)z=v.length;
